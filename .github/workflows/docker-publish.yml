name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push LeetCode API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/leetcode-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leetcode-api:latest
            ghcr.io/${{ github.repository_owner }}/leetcode-api:${{ github.sha }}

      - name: Build and Push Discord Bot Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/discord-bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leetcode-discord-bot:latest
            ghcr.io/${{ github.repository_owner }}/leetcode-discord-bot:${{ github.sha }}
